# L1-AUTOMATIC-REFERENCE: compare after editing on:; do not activate a second copy.
name: L1 - Learn Actions
run-name: L1 quality - ${{ github.event_name }} - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional non-secret note; displayed as data.
        type: string
        required: false
        default: manual-baseline
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: src/terraform

jobs:
  quality:
    name: L1 cloud-free quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform 1.16.3
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Report event, ref, and checked-out commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          RUN_NOTE: ${{ inputs.note || '' }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'Event: %s\nRef: %s\nEvent SHA: %s\n' "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          printf 'PR head SHA: %s\nChecked-out SHA: %s\n' "$PR_HEAD_SHA" "$checked_out_sha"
          printf 'Note (escaped for display only): %q\n' "$RUN_NOTE"
          {
            printf '## L1 run identity\n\n'
            printf -- '- Event: `%s`\n- Ref: `%s`\n' "$EVENT_NAME" "$EVENT_REF"
            printf -- '- Event SHA: `%s`\n- Checked-out SHA: `%s`\n' "$EVENT_SHA" "$checked_out_sha"
            printf -- '- PR head SHA: `%s`\n' "$PR_HEAD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Terraform formatting
        run: terraform fmt -check -diff

      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate the cloud-free configuration
        run: terraform validate -no-color
